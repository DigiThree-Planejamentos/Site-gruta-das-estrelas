<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" role="img" aria-labelledby="title desc">
  <title id="title">Location pin animation</title>
  <desc id="desc">Animated location pin marker with a subtle pulse.</desc>
  <style>
    :root {
      --pin-color: #a38e6f;
    }

    .pin-body {
      transform-origin: 960px 945px;
      animation: pinDrop 0.87s ease-in-out infinite;
    }

    @keyframes pinDrop {
      0%,
      100% {
        transform: translateY(-54px);
      }

      48% {
        transform: translateY(82px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pin-body {
        animation: none;
      }
    }
  </style>

  <g class="pin-body" fill="var(--pin-color)">
    <path d="M960 30.8c-211 0-382.6 171.6-382.6 382.6 0 261.8 357 662.4 357 662.4 13.7 15.2 37.6 15.2 51.3 0 0 0 357-400.6 357-662.4C1342.6 202.4 1170.9 30.8 960 30.8Zm0 337.6c106.1 0 192.5 86.4 192.5 192.5S1066.1 753.4 960 753.4 767.5 667 767.5 560.9 853.9 368.4 960 368.4Z" />
  </g>
</svg>
